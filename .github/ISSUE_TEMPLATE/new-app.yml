name: New App Submission
description: Submit a new Web3 app or protocol to be listed in the Lancers Dapp Registry.
title: "[New App]: "
labels:
  - new-app
body:
  - type: markdown
    attributes:
      value: |
        Use the published registry browser before filling this out:

        https://dapp-registry.lancers.technology/docs/registry.html

        Pick an existing category and exact chain names whenever they already fit. If you genuinely need a new category or chain, note that clearly in the final comments field.

  - type: input
    id: app_name
    attributes:
      label: App name
      description: Public product or protocol name.
      placeholder: Uniswap
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: Slug
      description: URL-safe slug you want used for the app folder and metadata.
      placeholder: uniswap
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Choose the single best matching category from the registry.
      options:
        - Blockchains
        - DAO Tools
        - DAOs
        - DeFi Dapps
        - DeFi Tools
        - Decentralized Games
        - Identity Tools
        - Infrastructure Tools
        - NFT Dapps
        - NFT Tools
        - Open Source Projects
        - RaaS Tools
        - Real World Asset Dapps
        - Solidity Tools
        - Trading Tools
        - Venture Capital Firms
        - Web3 Developer Tools
        - Web3 Gaming Tools
        - Web3 Security Tools
        - Web3 Service Providers
        - Web3 Social Dapps
        - Web3 Wallet Tools
        - Web3 Wallets
        - Zero Knowledge Tools
    validations:
      required: true

  - type: dropdown
    id: subcategories
    attributes:
      label: Subcategories
      description: GitHub issue forms cannot filter this list by category. Choose only subcategories allowed for your selected category; automation will validate the combination.
      multiple: true
      options:
        - AAA Web3 Games
        - ABI Tools
        - Account Abstraction (ERC-4337) Bundlers
        - Analytics Tools
        - Assemblers
        - Block Explorers
        - Blockchain Auditing Companies
        - Blockchain Interoperability Tools
        - Blockchain Security Tools
        - College Blockchain Clubs
        - Consensus Clients
        - Creator DAOs
        - Crypto Exchanges
        - Crypto Faucets
        - Crypto News Websites
        - Crypto Portfolio Dashboards
        - Crypto Staking Companies
        - Crypto Tax Tools
        - Crypto Trading Tools
        - Custody Solutions
        - DAO Developer Tools
        - DAO Project Management Tools
        - DAO Reputation Tools
        - Dapp Templates
        - Data Availability Blockchains
        - DeFi Yield Aggregators
        - DeFi Yield Farming Platforms
        - Debugging Tools
        - Decentralized CDPs
        - Decentralized Computing Tools
        - Decentralized Derivatives
        - Decentralized Exchanges
        - Decentralized Gaming Tools
        - Decentralized Identity Tools
        - Decentralized Indexes
        - Decentralized Insurance Dapps
        - Decentralized Lending Dapps
        - Decentralized Options
        - Decentralized Oracles
        - Decentralized Storage Tools
        - Decentralized Synthetics
        - Decentralized VPNs
        - Decompilers
        - Development Frameworks
        - Dissassemblers
        - ERC-4337 Paymasters
        - EVM Tools
        - Embedded Wallets
        - Ethereum Signature Tools
        - Execution Clients
        - Fiat Onramps
        - Fuzzing Tools
        - Gaming DAOs
        - Gaming NFT Marketplaces
        - Gas Tools
        - GitHub Open Source Projects
        - Hardware Wallets
        - Indexing Tools
        - Key Management Providers
        - Layer 1 Blockchains (L1s)
        - Layer 2 Blockchains
        - Liquid Staking Platforms
        - MEV Analytics Tools
        - MEV Tools
        - MPC Wallets
        - Metaverse Tools
        - Modular Interoperability Tools
        - Modular Plugins (ERC-6900)
        - Multisig Wallets
        - Music NFT Tools
        - NFT APIs
        - NFT Allowlist Tools
        - NFT Analytics Tools
        - NFT App Templates
        - NFT Distribution Tools
        - NFT Fractionalization Tools
        - NFT Lending Dapps
        - NFT Marketplaces
        - NFT Minting Tools
        - NFT Renting Dapps
        - NFT Smart Contract Templates
        - Name Service Tools
        - Private Credit RWAs
        - Proof-of-Personhood Tools
        - Quest-to-Earn Tools
