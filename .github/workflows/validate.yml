name: Validate DApp Data

on:
  push:
    branches:
      - main
    paths:
      - "src/apps/**"
      - "scripts/**"
      - "schema/**"
      - "lib/**"
      - "data/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/apps/**"
      - "scripts/**"
      - "schema/**"
      - "lib/**"
      - "data/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build scripts
        run: pnpm run build

      - name: Fill Missing Relations
        run: pnpm run fill:relations

      - name: Check for relation updates
        id: check_relation_changes
        run: |
          if git diff --quiet src/apps/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No relation updates generated."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Relation updates generated."
            git diff --name-only src/apps/
          fi

      - name: Create pull request for relation updates
        if: github.event_name == 'push' && steps.check_relation_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): auto-fill missing app relations"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          branch: "automation/fill-missing-relations"
          delete-branch: true
          title: "chore(data): auto-fill missing app relations"
          body: |
            This PR was opened automatically by GitHub Actions.

            It contains generated relation backfills from `pnpm run fill:relations`.

            Please review and merge if the suggested relations look correct.

      - name: Check Missing Relations
        run: pnpm run check:relations

      - name: Run DApp Data Validation
        run: pnpm run validate

      - name: Run Tests
        run: pnpm test

      - name: Validation Summary
        if: success()
        run: |
          echo "## Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All metadata files validated successfully." >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_relation_changes.outputs.has_changes }}" == "true" ]; then
            echo "Missing relations were auto-filled during this run." >> $GITHUB_STEP_SUMMARY
          fi
