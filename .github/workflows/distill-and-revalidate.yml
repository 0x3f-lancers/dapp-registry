name: Distill & Revalidate DApp Data

on:
  push:
    branches:
      - main
    paths:
      - "src/apps/**/meta.json"
      - "scripts/distill.ts"
      - "schema/metaJsonSchema.ts"
      - "schema/faucetIndexJson.ts"
      - "schema/appsMinSchema.ts"
      - "scripts/generate-facets.ts"
      - "lib/cloudinary.ts"
      - "lib/logger.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  distill_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build scripts
        run: pnpm run build

      - name: Check Cloudinary credentials
        id: check_cloudinary
        run: |
          if [ -z "${{ secrets.CLOUDINARY_CLOUD_NAME }}" ] || [ -z "${{ secrets.CLOUDINARY_API_KEY }}" ] || [ -z "${{ secrets.CLOUDINARY_API_SECRET }}" ]; then
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "::warning::Cloudinary credentials not configured. Logo uploads will be skipped."
          else
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          fi

      - name: Load Environment Variables
        if: steps.check_cloudinary.outputs.has_credentials == 'true'
        run: |
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> $GITHUB_ENV
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> $GITHUB_ENV
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> $GITHUB_ENV
          echo "HMAC_SECRET=${{ secrets.HMAC_SECRET }}" >> $GITHUB_ENV

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: "src/apps/**/meta.json"

      - name: Extract changed dapp slugs
        id: get_changed_dapp_slugs
        run: |
          SLUGS=()
          for file in ${{ steps.changed-files.outputs.modified_files }} ${{ steps.changed-files.outputs.added_files }}; do
            slug=$(echo "$file" | sed -E 's|src/apps/([^/]+)/meta.json|\1|')
            if [[ "$slug" != "$file" ]]; then
              SLUGS+=("$slug")
            fi
          done
          UNIQUE_SLUGS=$(printf "%s\n" "${SLUGS[@]}" | sort -u | tr '\n' ' ' | xargs)
          echo "Found changed slugs: $UNIQUE_SLUGS"
          echo "slugs=$UNIQUE_SLUGS" >> $GITHUB_OUTPUT
        shell: bash

      - name: Run DApp Data Distillation
        run: |
          SLUGS="${{ steps.get_changed_dapp_slugs.outputs.slugs }}"
          if [ -n "$SLUGS" ]; then
            pnpm run distill $SLUGS
          else
            pnpm run distill
          fi

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet src/apps/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to meta.json files"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in meta.json files"
            git diff --name-only src/apps/
          fi

      - name: Commit updated meta.json files
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/apps/*/meta.json
          git commit -m "chore(data): auto-generated DApp data files

          Updated logoUrl fields with Cloudinary URLs.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Distillation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "- Updated meta.json files with Cloudinary URLs" >> $GITHUB_STEP_SUMMARY
            echo "- Changes committed and pushed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- No changes to commit" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.check_cloudinary.outputs.has_credentials }}" == "false" ]; then
            echo "- Cloudinary credentials not configured (logo uploads skipped)" >> $GITHUB_STEP_SUMMARY
          fi
